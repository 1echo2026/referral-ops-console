<!doctype html>
<html lang="zh-CN">
<head>
  <script src="demo-mock.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业绩排行 · 转介绍数据看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M5 18V11M10 18V6M15 18v-5M20 18H4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" id="brandName">转介绍数据看板</span>
        <span class="brand-sub" id="brandSub">基地经营</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a class="nav-link" href="index.html">总览</a>
      <a class="nav-link" href="tables.html">专项明细</a>
      <a class="nav-link active" href="rankings.html">业绩排行</a>
      <a class="nav-link" href="records.html">明细名单</a>
    </nav>
    <div class="header-user">
      <span class="meta-chip" id="viewerChip">—</span>
      <a class="header-action hidden" href="admin.html" id="adminLink">后台管理</a>
      <button class="header-action" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">业绩排行</h1>
      <p class="page-sub" id="pageSubtitle">按取数逻辑实时计算的高经 / 团队 / 顾问榜单</p>
    </div>
    <div class="head-meta">
      <span class="meta-chip"><span class="dot"></span><span id="rankUpdated">—</span></span>
    </div>
  </div>

  <div class="filter-bar records-toolbar" style="padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-xs);margin-bottom:16px">
    <div class="field">
      <label>数据类别</label>
      <select class="control" id="datasetFilter" style="min-width:180px"></select>
    </div>
    <div class="field">
      <label>时间</label>
      <select class="control" id="rangeFilter">
        <option value="all">全部时间</option>
        <option value="30">近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="month">本月</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="field hidden" id="fromField">
      <input class="control" type="date" id="fromFilter">
    </div>
    <div class="field hidden" id="toField">
      <input class="control" type="date" id="toFilter">
    </div>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="resetFilters" type="button">重置</button>
  </div>

  <div class="rank-summary" id="rankSummary">
    <div class="skeleton" style="height:96px"></div>
    <div class="skeleton" style="height:96px"></div>
    <div class="skeleton" style="height:96px"></div>
  </div>

  <div class="table-tabs" id="rankTabs">
    <button class="table-tab active" type="button" data-key="manager">高经榜</button>
    <button class="table-tab" type="button" data-key="team">团队榜</button>
    <button class="table-tab" type="button" data-key="emp">顾问榜</button>
  </div>

  <div class="rank-card" id="stdCard">
    <div class="rank-titlebar">
      <div>
        <div class="rank-title" id="rankTitle">—</div>
        <div class="rank-sub" id="rankSub">—</div>
      </div>
      <div class="rank-actions">
        <button class="btn btn-sm" id="copyRank" type="button">复制表格</button>
        <button class="btn btn-sm" id="exportRank" type="button">导出 CSV</button>
        <button class="btn btn-sm hidden" id="editNote" type="button">编辑备注</button>
      </div>
    </div>
    <div class="rank-note hidden" id="rankNote"></div>
    <div class="sheet-scroll">
      <table class="rank-table" id="rankTable">
        <thead id="rankHead"></thead>
        <tbody id="rankBody"><tr><td><div class="skeleton skeleton-line"></div></td></tr></tbody>
      </table>
    </div>
    <div class="sheet-foot" id="rankFoot">—</div>
  </div>

  <div class="rank-card hidden" id="perfCard"></div>

  <footer class="page-foot">
    <div>榜单由取数逻辑实时计算，仅供内部参考，以最终核算为准。</div>
  </footer>
</main>

<script src="assets/ui.js"></script>
<script src="assets/rankings.js"></script>
</body>
</html>
