<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专项明细 · 转介绍数据看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M5 18V11M10 18V6M15 18v-5M20 18H4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" id="brandName">转介绍数据看板</span>
        <span class="brand-sub" id="brandSub">基地经营</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a class="nav-link" href="/">总览</a>
      <a class="nav-link active" href="/tables">专项明细</a>
      <a class="nav-link" href="/rankings">业绩排行</a>
      <a class="nav-link" href="/records">明细名单</a>
    </nav>
    <div class="header-user">
      <span class="meta-chip" id="viewerChip">—</span>
      <a class="header-action hidden" href="/admin" id="adminLink">后台管理</a>
      <button class="header-action" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">专项明细</h1>
      <p class="page-sub" id="pageSubtitle">按数据类别查看各基地的指标汇总</p>
    </div>
    <div class="head-meta">
      <span class="meta-chip"><span class="dot"></span><span id="updatedAt">—</span></span>
      <button class="btn btn-sm btn-primary" id="exportExcel" type="button" style="display:none">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        导出 Excel
      </button>
    </div>
  </div>

  <div class="table-tabs" id="tableTabs"></div>

  <div class="sheet-card" id="sheetCard">
    <div class="sheet-titlebar" id="sheetTitlebar">
      <span class="sheet-title" id="sheetTitle">加载中…</span>
      <span class="sheet-tag" id="sheetTag"></span>
    </div>
    <div class="sheet-note" id="sheetNote">—</div>
    <div class="sheet-scroll">
      <table class="sheet-table" id="sheetTable">
        <thead id="sheetHead"></thead>
        <tbody id="sheetBody"><tr><td><div class="skeleton skeleton-line"></div></td></tr></tbody>
      </table>
    </div>
    <div class="sheet-foot" id="sheetFoot">—</div>
  </div>

  <footer class="page-foot">
    <div>汇总口径由后台「取数逻辑」配置，修改口径后本页数字即时变化。</div>
  </footer>
</main>

<script src="/assets/vendor/xlsx.full.min.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/tables.js"></script>
</body>
</html>
