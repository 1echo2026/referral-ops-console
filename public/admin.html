<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营中台 · 转介绍数据看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M5 18V11M10 18V6M15 18v-5M20 18H4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/admin">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">转介绍数据中台</span>
        <span class="brand-sub">OPERATIONS CONSOLE</span>
      </span>
    </a>

    <nav class="nav">
      <div class="nav-group">
        <div class="nav-label">数据链路</div>
        <button class="nav-item" data-view="datasets" data-icon="database"><span>数据底表</span><span class="nav-dot" id="dsCount">4</span></button>
        <button class="nav-item" data-view="records" data-icon="list"><span>数据管理</span></button>
        <button class="nav-item" data-view="feishu" data-icon="cloud"><span>飞书同步</span></button>
        <button class="nav-item" data-view="org" data-icon="users"><span>销售架构</span></button>
        <button class="nav-item" data-view="tutor" data-icon="users"><span>辅导架构</span></button>
        <button class="nav-item" data-view="targets" data-icon="target"><span>业绩目标</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">应用</div>
        <a class="nav-item" href="/" target="_blank" rel="noopener" data-icon="eye"><span>前台看板</span></a>
      </div>
      <div class="nav-group">
        <div class="nav-label">系统</div>
        <button class="nav-item" data-view="settings" data-icon="sliders"><span>展示配置</span></button>
        <button class="nav-item" data-view="accounts" data-icon="shield"><span>账号与权限</span></button>
        <button class="nav-item" data-view="audit" data-icon="history"><span>操作日志</span></button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <div class="avatar" id="userAvatar">管</div>
        <div style="min-width:0">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-sm" id="logoutBtn" type="button" style="flex:1">退出登录</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">数据底表</h1>
          <p class="sub" id="pageSub">每类看板数据的上传入口，以及上传后如何取数的逻辑配置</p>
        </div>
        <div class="topbar-actions" id="topActions"></div>
      </div>

      <div id="globalError" class="alert err hidden"></div>

      <section class="view" id="view-datasets"></section>
      <section class="view hidden" id="view-records"></section>
      <section class="view hidden" id="view-feishu"></section>
      <section class="view hidden" id="view-org"></section>
      <section class="view hidden" id="view-tutor"></section>
      <section class="view hidden" id="view-targets"></section>
      <section class="view hidden" id="view-settings"></section>
      <section class="view hidden" id="view-accounts"></section>
      <section class="view hidden" id="view-audit"></section>
    </div>
  </main>
</div>

<script src="/assets/vendor/xlsx.full.min.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
